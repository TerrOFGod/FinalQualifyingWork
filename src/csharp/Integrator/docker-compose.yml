version: '3.8'

services:
  # Векторное хранилище Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"      # HTTP API
      - "6334:6334"      # gRPC API (опционально)
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - app-network

  # Графовая база данных Neo4j
  neo4j:
    image: neo4j:latest
    container_name: neo4j
    ports:
      - "7474:7474"      # HTTP (браузер Neo4j)
      - "7687:7687"      # Bolt (основной протокол)
    environment:
      - NEO4J_AUTH=neo4j/test1234     # логин: neo4j, пароль: test1234 (измените при необходимости)
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]  # опционально, установка плагинов
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    restart: unless-stopped
    networks:
      - app-network

volumes:
  qdrant_storage:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:

networks:
  app-network:
    driver: bridge